<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="hillFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Topographic Contour Lines (Rwanda Thousand Hills motif) -->
  <g fill="none" stroke="url(#hillFade)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ridge 1 -->
    <path d="M-50 80 Q 150 20 350 70 T 750 40 T 900 80" />
    <path d="M-50 110 Q 140 45 360 95 T 760 65 T 900 110" stroke-width="1.25" />
    <path d="M-50 140 Q 160 70 380 120 T 740 90 T 900 140" stroke-width="1.5" />
    
    <!-- Ridge 2 (Central Peaks) -->
    <path d="M-50 190 Q 100 130 300 160 T 600 130 T 900 180" stroke-width="1.75" />
    <path d="M-50 220 Q 120 160 320 190 T 620 160 T 900 210" stroke-width="1.25" />
    <path d="M-50 250 Q 80 190 280 220 T 640 190 T 900 240" stroke-width="1.5" />

    <!-- Ridge 3 (Foreground Rolling Hills) -->
    <path d="M-50 290 Q 200 240 450 270 T 800 230 T 900 280" stroke-width="2" />
    <path d="M-50 320 Q 180 270 430 300 T 780 260 T 900 310" stroke-width="1.25" />
    <path d="M-50 350 Q 220 300 470 330 T 820 290 T 900 340" stroke-width="1.5" />
    <path d="M-50 380 Q 240 330 490 360 T 840 320 T 900 370" stroke-width="1.25" />
  </g>
</svg>

