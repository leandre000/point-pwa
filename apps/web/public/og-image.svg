<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B2C" />
      <stop offset="60%" stop-color="#205641" />
      <stop offset="100%" stop-color="#0E2B1F" />
    </linearGradient>
    <linearGradient id="topog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Topographic Hills -->
  <g fill="none" stroke="url(#topog)" stroke-width="2.5" opacity="0.85">
    <path d="M-100 150 Q 200 40 600 120 T 1300 80" />
    <path d="M-100 200 Q 250 80 650 170 T 1300 130" stroke-width="2" />
    <path d="M-100 260 Q 180 140 580 230 T 1300 190" stroke-width="2.5" />
    <path d="M-100 340 Q 300 220 700 310 T 1300 270" stroke-width="2" />
    <path d="M-100 420 Q 220 300 620 390 T 1300 350" stroke-width="3" />
    <path d="M-100 500 Q 350 380 750 470 T 1300 430" stroke-width="2" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 160)">
    <!-- Location-Pin "K" Logomark -->
    <g transform="translate(0, 0)">
      <rect width="112" height="112" rx="26" fill="#FAF9F6" />
      <g transform="scale(0.5833)">
        <rect x="44" y="42" width="22" height="108" rx="7" fill="#205641" />
        <path d="M66 102 L118 150 C121 153 126 153 130 150 L140 140 C143 137 143 132 140 129 L96 89 Z" fill="#205641" />
        <path d="M66 90 L108 52 C111 49 116 50 119 53 L126 60 C129 63 129 68 126 71 L88 106 Z" fill="#205641" />
        <path d="M130 38 C144 38 155 49 155 63 C155 77 138 97 132 103 C131 104 129 104 128 103 C122 97 105 77 105 63 C105 49 116 38 130 38 Z" fill="#E0A12B" />
        <circle cx="130" cy="63" r="8" fill="#FAF9F6" />
      </g>
    </g>

    <!-- Wordmark & Tagline -->
    <text x="144" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em" fill="#FAF9F6">
      KIRAKA
    </text>
    <text x="148" y="104" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="500" letter-spacing="-0.01em" fill="#DCEBE1">
      Find help. Discover opportunity.
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" fill="#FAF9F6">
      Kigali's trusted marketplace for local services
    </text>
    <text x="0" y="240" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#B9D6C4">
      Cleaning · Plumbing · Electrical · Carpentry · General Maintenance
    </text>

    <!-- Location Pill -->
    <g transform="translate(0, 276)">
      <rect width="180" height="42" rx="21" fill="#E0A12B" />
      <text x="90" y="27" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#123B2C" text-anchor="middle">
        Kigali, Rwanda
      </text>
    </g>
  </g>
</svg>

